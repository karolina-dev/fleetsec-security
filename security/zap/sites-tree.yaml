- node: Sites
  children:
  - node: http://host.docker.internal:8000
    url: http://host.docker.internal:8000
    method: GET
    children:
    - node: GET:/
      url: http://host.docker.internal:8000/
      method: GET
      responseLength: 153
      statusCode: 200
    - node: auth
      url: http://host.docker.internal:8000/auth
      method: GET
      children:
      - node: "POST:login()({username,password})"
        url: http://host.docker.internal:8000/auth/login
        method: POST
        responseLength: 158
        statusCode: 200
        data: '%7B%22username%22%3A%22John+Doe%22%2C%22password%22%3A%22ZAP%22%7D='
    - node: GET:health
      url: http://host.docker.internal:8000/health
      method: GET
      responseLength: 167
      statusCode: 200
    - node: GET:openapi.json
      url: http://host.docker.internal:8000/openapi.json
      method: GET
      responseLength: 8113
      statusCode: 200
