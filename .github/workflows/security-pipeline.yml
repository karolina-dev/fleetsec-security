name: FleetSec Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    name: Tests and Container Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest

      - name: Start API for DAST
        env:
          FLEETSEC_SECRET_KEY: ${{ secrets.FLEETSEC_SECRET_KEY }}
          FLEETSEC_ADMIN_USERNAME: ${{ secrets.FLEETSEC_ADMIN_USERNAME }}
          FLEETSEC_ADMIN_PASSWORD: ${{ secrets.FLEETSEC_ADMIN_PASSWORD }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          sleep 5

          if ! curl --fail http://127.0.0.1:8000/health; then
            echo "=== API LOG ==="
            cat api.log
            exit 1
          fi
          
      - name: Get JWT for DAST
        env:
          FLEETSEC_ADMIN_USERNAME: ${{ secrets.FLEETSEC_ADMIN_USERNAME }}
          FLEETSEC_ADMIN_PASSWORD: ${{ secrets.FLEETSEC_ADMIN_PASSWORD }}
        run: |
          payload=$(jq -n \
            --arg username "$FLEETSEC_ADMIN_USERNAME" \
            --arg password "$FLEETSEC_ADMIN_PASSWORD" \
            '{username:$username,password:$password}')

          TOKEN=$(curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            http://127.0.0.1:8000/auth/login | \
            python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          echo "ZAP_AUTH_HEADER_VALUE=Bearer $TOKEN" >> "$GITHUB_ENV"

      - name: Run DAST with OWASP ZAP
        run: |
          mkdir -p security/zap/dast-output
          chmod 777 security/zap/dast-output

          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e "ZAP_AUTH_HEADER_VALUE=$ZAP_AUTH_HEADER_VALUE" \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap.sh -cmd -autorun /zap/wrk/security/zap/zap.yaml

      - name: Prepare DAST evidence
        run: |
          mv security/zap/dast-output/zap-report.json security/zap/zap-report.json
          mv security/zap/dast-output/sites-tree.yaml security/zap/sites-tree.yaml

      - name: Run SCA with Trivy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.74.0 \
            fs \
            --scanners vuln \
            --format json \
            --output /work/trivy-sca.json \
            /work

          python security/scripts/check_sca.py

      - name: Run SAST with Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --error

      - name: Run custom Semgrep rules
        run: |
          semgrep scan --config security/semgrep-rules.yml --error

      - name: Build Docker image
        run: |
          docker build -t fleetsec-api:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: fleetsec-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.74.0 \
            fs \
            --format cyclonedx \
            --output /work/sbom.json \
            /work

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleetsec-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30