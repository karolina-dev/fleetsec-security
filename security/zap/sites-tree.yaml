        url: http://host.docker.internal:8000/vapt/v03
        method: GET
        children:
        - node: GET:fetch(url)
          url: http://host.docker.internal:8000/vapt/v03/fetch?url=https%3A%2F%2Fexample.com
          method: GET
          responseLength: 756
          statusCode: 200
      - node: v04
        url: http://host.docker.internal:8000/vapt/v04
        method: GET
        children:
        - node: POST:xml(xml)
          url: http://host.docker.internal:8000/vapt/v04/xml?xml=%3Cvehicle%3E%3Cplate%3EABC123%3C%2Fplate%3E%3C%2Fvehicle%3E
          method: POST
          responseLength: 194
          statusCode: 200
          data: =
      - node: v05
        url: http://host.docker.internal:8000/vapt/v05
        method: GET
        children:
        - node: users
          url: http://host.docker.internal:8000/vapt/v05/users
          method: GET
          children:
          - node: PUT:«username»()("John Doe")
