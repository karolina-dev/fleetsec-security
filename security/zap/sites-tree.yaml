            method: PUT
            responseLength: 256
            statusCode: 422
          - node: "PUT:«username»()({username})"
            url: http://host.docker.internal:8000/vapt/v05/users/vapt-driver
            method: PUT
            responseLength: 160
            statusCode: 200
      - node: v06
        url: http://host.docker.internal:8000/vapt/v06
        method: GET
        children:
        - node: GET:file(filename)
          url: http://host.docker.internal:8000/vapt/v06/file?filename=public.txt
          method: GET
          responseLength: 160
          statusCode: 200
      - node: v07
        url: http://host.docker.internal:8000/vapt/v07
        method: GET
        children:
        - node: "POST:login(password,username)"
          url: http://host.docker.internal:8000/vapt/v07/login?username=test&password=wrong
          method: POST
          responseLength: 173
          statusCode: 401
          data: =
      - node: v08
        url: http://host.docker.internal:8000/vapt/v08
        method: GET
        children:
        - node: "POST:log(document,email)"
          url: http://host.docker.internal:8000/vapt/v08/log?document=123456789&email=prueba.fleetsec@example.com
          method: POST
          responseLength: 149
          statusCode: 200
          data: =
      - node: v09
        url: http://host.docker.internal:8000/vapt/v09
        method: GET
        children:
        - node: vehicles
          url: http://host.docker.internal:8000/vapt/v09/vehicles
          method: GET
          children:
          - node: GET:«vehicle_id»
            url: http://host.docker.internal:8000/vapt/v09/vehicles/1
