name: FleetSec Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    name: Tests and Container Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest

      - name: Run SAST with Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --error

      - name: Run custom Semgrep rules
        run: |
          semgrep scan --config security/semgrep-rules.yml --error

      - name: Build Docker image
        run: |
          docker build -t fleetsec-api:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: fleetsec-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy:0.74.0 \
            fs \
            --format cyclonedx \
            --output /work/sbom.json \
            /work

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleetsec-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30